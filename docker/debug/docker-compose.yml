version: '2'
services:
  web:
    build:
      context: ../..
      dockerfile: docker/debug/Dockerfile
      #args:
       # - USER=${USER}
    # Ensure the container uses the user created in Dockerfile
    # user: ${USER}

    environment:
      - DATABASE_HOST=db
      - MEMCACHE_SERVERS=memcached
      - USER=${USER}

    volumes:
      # Mount the code, but be careful not to overwrite the container's installed gems
      - ../../:/myapp
    ports:
      - "172.17.0.1:5000:5000"
    restart: unless-stopped
    networks: [comms_net]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5000/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 30s

      
    # ports:
    #   - "11211:11211"
    depends_on:
      - db
      - memcached

  db:
    image: postgres:9.6-alpine
    environment:
      POSTGRES_USER: "admin"
      POSTGRES_PASSWORD: "password"

  memcached:
    image: memcached:alpine
